server {
    listen 80;
    server_name localhost;

    # Static files
    location /static/ {
        alias /app/staticfiles/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Private uploads (payment receipts, tuition proofs, speaking audio) must never be
    # reachable by URL. A regex location outranks the plain /media/ prefix below, so these
    # paths are refused here and are only served by Django after an authorization check
    # (see /api/v1/files/... and PRIVATE_MEDIA_ACCEL_PREFIX).
    location ~ ^/media/(receipts|tuition/proofs|speaking/audio)/ {
        return 404;
    }

    # Media files
    location /media/ {
        alias /app/media/;
        expires 30d;
    }

    # Target of Django's X-Accel-Redirect for private files. `internal` makes it
    # unreachable from the outside; Django has already authorized the request and
    # sets Cache-Control/Content-Disposition/CSP on the response.
    location /_private_media/ {
        internal;
        alias /app/media/;
    }

    # Django app
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for Arena)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # -- React SPA -----------------------------------------------------------
    # Dev stays a pure Django proxy on purpose: the web service bind-mounts
    # the source tree (hiding the baked /app/spa) and the UI runs on vite
    # :5173 with same-origin proxying. Production (deploy/nginx/nginx-ssl.conf)
    # serves the baked SPA from the spa_volume with try_files and narrows
    # Django to API-only prefixes (/api/, /essays/, /arena/, /subscribe/,
    # /tma/, /ws/, /static/, /media/, /admin/).

    # Client max body size (for file uploads)
    client_max_body_size 10M;
}
