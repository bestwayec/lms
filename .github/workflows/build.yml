# ============================================================================
# LMS Platform — Build & push verified release image to GHCR
#
# Triggers:
#   - workflow_run on Release (main, success): builds the exact release commit
#     whose parent passed CI and whose VERSION equals the GitHub Release.
#   - workflow_dispatch: manual rebuild for a verified main commit.
# Produces: ghcr.io/bestwayec/lms:sha-<sha>, :v<VERSION>, and :latest.
# Auth (push): GITHUB_TOKEN with packages:write — no PAT needed.
# ============================================================================

name: Build

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit SHA to build (default: main)"
        required: false
        default: "main"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 0

      - name: Download release metadata from Release run
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: release-meta
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/release-meta

      - name: Resolve and verify release commit
        id: vsha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_SHA=""
          SOURCE_CI_SHA=""
          EXPECTED_VERSION=""

          if [ -f /tmp/release-meta/release-meta.env ]; then
            # shellcheck disable=SC1091
            . /tmp/release-meta/release-meta.env
            RELEASE_SHA="${RELEASE_SHA:-}"
            SOURCE_CI_SHA="${SOURCE_CI_SHA:-}"
            EXPECTED_VERSION="${VERSION:-}"
          fi

          if [ -z "$RELEASE_SHA" ]; then
            RELEASE_SHA="$(git rev-parse HEAD)"
          fi
          git checkout "$RELEASE_SHA"

          # Verify CI passed on the commit (or immediate parent when HEAD only bumped VERSION)
          if [ -z "$SOURCE_CI_SHA" ]; then
            HEAD_MSG="$(git log -1 --pretty=%s "$RELEASE_SHA")"
            if echo "$HEAD_MSG" | grep -q '^chore(release):'; then
              SOURCE_CI_SHA="$(git rev-parse "${RELEASE_SHA}^")"
            else
              SOURCE_CI_SHA="$RELEASE_SHA"
            fi
          fi

          if [ "$RELEASE_SHA" != "$SOURCE_CI_SHA" ]; then
            CHANGED="$(git diff --name-only "$SOURCE_CI_SHA" "$RELEASE_SHA" | tr '\n' ' ' | xargs)"
            if [ "$CHANGED" != "VERSION" ]; then
              echo "::error::Release commit $RELEASE_SHA differs from CI commit $SOURCE_CI_SHA beyond VERSION ($CHANGED)."
              exit 1
            fi
          fi

          CONCLUSION="$(gh run list --commit "$SOURCE_CI_SHA" --workflow CI --json conclusion -q '.[0].conclusion' 2>/dev/null || echo '')"
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::Source commit $SOURCE_CI_SHA has not passed CI (status='$CONCLUSION'). Refusing to build."
            exit 1
          fi

          FILE_VERSION="$(tr -d ' \r\n' < VERSION)"
          if [ -n "$EXPECTED_VERSION" ] && [ "$FILE_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::VERSION mismatch: file has '$FILE_VERSION', release-meta expected '$EXPECTED_VERSION'."
            exit 1
          fi

          SHORT="$(echo "$RELEASE_SHA" | cut -c1-7)"
          echo "Verified release commit $RELEASE_SHA (CI commit $SOURCE_CI_SHA, version $FILE_VERSION)."
          {
            echo "sha=$RELEASE_SHA"
            echo "short=$SHORT"
            echo "version=$FILE_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata (sha + SemVer + latest tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ steps.vsha.outputs.short }}
            type=raw,value=v${{ steps.vsha.outputs.version }}
            type=raw,value=latest

      - name: Log in to GHCR (push scope, GITHUB_TOKEN)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & push (with cache export)
        id: build_cached
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: mode=min
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.vsha.outputs.version }}
            VCS_REF=${{ steps.vsha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Build & push (fallback without cache export)
        if: steps.build_cached.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: mode=min
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.vsha.outputs.version }}
            VCS_REF=${{ steps.vsha.outputs.sha }}
          cache-from: type=gha

      - name: Verify image manifest in GHCR
        id: verify
        run: |
          set -euo pipefail
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.vsha.outputs.short }}"
          docker buildx imagetools inspect "$IMAGE_REF" | tee /tmp/inspect.txt
          DIGEST="$(grep -m1 '^Digest:' /tmp/inspect.txt | awk '{print $2}' || true)"
          {
            echo "RELEASE_SHA=${{ steps.vsha.outputs.sha }}"
            echo "RELEASE_SHORT=${{ steps.vsha.outputs.short }}"
            echo "IMAGE_TAG=sha-${{ steps.vsha.outputs.short }}"
            echo "VERSION=${{ steps.vsha.outputs.version }}"
            echo "TAG=v${{ steps.vsha.outputs.version }}"
            echo "DIGEST=${DIGEST}"
          } > build-meta.env

      - name: Upload build metadata artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-meta
          path: build-meta.env
          retention-days: 30
          if-no-files-found: error
