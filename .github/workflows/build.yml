# ============================================================================
# LMS Platform — Build & push image to GHCR
#
# Triggers: push to main (CI must be green via branch protection) + manual.
# Produces: ghcr.io/algorithco/lms:sha-<sha> (immutable) + :latest (movable).
# Auth (push): GITHUB_TOKEN with packages:write — short-lived, no PAT needed.
# ============================================================================

name: Build

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      # Build exactly the commit CI verified. A bare checkout on a workflow_run
      # event takes the branch's *latest* commit, which can be newer (and
      # untested) if something landed between CI and Build.
      - name: Resolve verified commit
        id: vsha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"

          # Guard: manual dispatch must only build a commit that actually passed CI
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CONCLUSION=$(gh run list --commit "${SHA}" --workflow CI --json conclusion -q '.[0].conclusion' 2>/dev/null || echo "")
            if [ "${CONCLUSION}" != "success" ]; then
              echo "::error::Commit ${SHA} has not passed CI (status: '${CONCLUSION}'). Refusing to build or publish unverified image."
              exit 1
            fi
            echo "Verified commit ${SHA} has passed CI."
          fi

          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short=$(echo "${SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.vsha.outputs.sha }}

      - name: Docker metadata (sha + latest tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ steps.vsha.outputs.short }}
            type=raw,value=latest

      - name: Log in to GHCR (push scope, GITHUB_TOKEN)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHA cache export requires the buildx driver (default docker driver
      # rejects cache-to). Pinned major version for stability.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Attempt build & push with cache export (using mode=min for resilience).
      # If GitHub Actions Cache API fails (e.g. 504 Gateway Timeout on layer blob export),
      # continue-on-error catches it so we can fall back to building & pushing without cache-to.
      - name: Build & push (with cache export)
        id: build_cached
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      # Fallback: if cache export failed, build & push directly with cache-from only (no cache-to).
      # This step does NOT have continue-on-error, ensuring genuine build/push failures are fatal.
      - name: Build & push (fallback without cache export)
        if: steps.build_cached.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      # Verify the image exists in GHCR and matches the CI-verified commit
      - name: Verify image manifest in GHCR
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.vsha.outputs.short }}"
