# ============================================================================
# LMS Platform — Release pipeline
#
#   PR → CI → Security → (merge to main) → CI on main → Build (exact CI SHA,
#   immutable sha-xxxxxxx image) → STAGING deploy + smoke  [automatic]
#                                → PRODUCTION deploy      [manual only]
#
# Production can NEVER deploy automatically from this workflow: the
# production job runs only on workflow_dispatch, only with an immutable
# sha-xxxxxxx tag, only after typing the confirmation phrase, and inside the
# `production` environment (add required reviewers there for a second gate).
# Rollback = run it again with the previous tag (see .last_good_tag on the VPS);
# the pre-deploy database backup is in /opt/backups/lms/pre-deploy.
#
# Secrets (environment-scoped):
#   staging:    STAGING_HOST STAGING_USER STAGING_SSH_KEY [STAGING_SSH_PORT] STAGING_DOMAIN
#   production: VPS_HOST VPS_USER VPS_SSH_KEY [VPS_SSH_PORT]
#   both:       GHCR_USER GHCR_READ_TOKEN [OPENROUTER_API_KEY]
# ============================================================================

name: Deploy

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Immutable image tag to put on PRODUCTION (sha-xxxxxxx; for rollback use the previous one)"
        required: true
      confirm:
        description: "Type exactly: deploy grandec.uz"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  staging:
    # Automatic, but only to staging infrastructure.
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: staging
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: build-meta
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/build-meta

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve verified release image and commit
        id: tag
        run: |
          set -euo pipefail
          DEPLOY_SHA="${{ github.event.workflow_run.head_sha }}"
          IMG_TAG="sha-$(echo "${DEPLOY_SHA}" | cut -c1-7)"
          REL_VER="$(tr -d ' \r\n' < VERSION)"
          if [ -f /tmp/build-meta/build-meta.env ]; then
            # shellcheck disable=SC1091
            . /tmp/build-meta/build-meta.env
            DEPLOY_SHA="${RELEASE_SHA:-$DEPLOY_SHA}"
            IMG_TAG="${IMAGE_TAG:-$IMG_TAG}"
            REL_VER="${VERSION:-$REL_VER}"
          fi
          git checkout "$DEPLOY_SHA"
          echo "sha=${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"
          echo "value=${IMG_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${REL_VER}" >> "$GITHUB_OUTPUT"

      - name: Staging configured?
        id: cfg
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_DOMAIN: ${{ secrets.STAGING_DOMAIN }}
        run: |
          if [ -n "${STAGING_HOST}" ] && [ -n "${STAGING_DOMAIN}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Staging is not configured (STAGING_HOST / STAGING_DOMAIN secrets missing in the 'staging' environment). Nothing was deployed anywhere."
          fi

      - name: Deploy to staging
        if: ${{ steps.cfg.outputs.ready == 'true' }}
        env:
          IMS_IMAGE_TAG: ${{ steps.tag.outputs.value }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DEPLOY_DOMAIN: ${{ secrets.STAGING_DOMAIN }}
          VPS_HOST: ${{ secrets.STAGING_HOST }}
          VPS_USER: ${{ secrets.STAGING_USER }}
          VPS_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          VPS_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: deploy/ci-ssh-deploy.sh

      - name: Staging smoke tests
        if: ${{ steps.cfg.outputs.ready == 'true' }}
        env:
          DOMAIN: ${{ secrets.STAGING_DOMAIN }}
        run: deploy/scripts/smoke_test.sh "https://${DOMAIN}"

      - name: Release report
        if: always()
        run: |
          {
            echo "## Staging release report"
            echo "- Commit (CI-verified): \`${{ github.event.workflow_run.head_sha }}\`"
            echo "- Image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}\`"
            echo "- Staging configured: ${{ steps.cfg.outputs.ready }}"
            echo "- Job status: ${{ job.status }}"
            echo "- Production: **not deployed** — run *Deploy* manually with tag \`${{ steps.tag.outputs.value }}\` after review."
          } >> "$GITHUB_STEP_SUMMARY"

  production:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Guard — confirmation and immutable tag
        env:
          TAG: ${{ inputs.tag }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "${CONFIRM}" != "deploy grandec.uz" ]; then
            echo "Confirmation phrase mismatch — refusing to deploy production."; exit 1
          fi
          if ! echo "${TAG}" | grep -Eq '^sha-[0-9a-f]{7}$'; then
            echo "Tag must be an immutable sha-xxxxxxx image tag (got '${TAG}')."; exit 1
          fi

      - name: Resolve the commit of that image
        id: src
        env:
          TAG: ${{ inputs.tag }}
        run: echo "sha=${TAG#sha-}" >> "$GITHUB_OUTPUT"

      # Config/scripts from the exact commit of that immutable image tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Checkout immutable image commit
        run: git checkout "${{ steps.src.outputs.sha }}"

      - name: Deploy to production
        env:
          IMS_IMAGE_TAG: ${{ inputs.tag }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DEPLOY_DOMAIN: grandec.uz
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: deploy/ci-ssh-deploy.sh

      - name: Production health
        run: deploy/scripts/smoke_test.sh https://grandec.uz

      - name: Release report
        if: always()
        run: |
          {
            echo "## Production release report"
            echo "- Image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}\`"
            echo "- Requested by: ${{ github.actor }}"
            echo "- Job status: ${{ job.status }}"
            echo "- Pre-deploy DB backup: /opt/backups/lms/pre-deploy (see deploy log)"
            echo "- Rollback: run Deploy with the previous tag from /opt/lms/.last_good_tag"
          } >> "$GITHUB_STEP_SUMMARY"
