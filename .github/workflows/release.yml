# Release — deterministic SemVer tags from main (no PAT needed).
#
# Rule (see .github/VERSIONING.md):
#   CI green on main -> bump MINOR (or workflow_dispatch minor/patch/major)
#   Update VERSION -> commit chore(release): vX.Y.Z [skip ci] -> tag vX.Y.Z ON that commit
#   -> push commit + tag -> create GitHub Release -> Build workflow packages exact release commit.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part to bump
        required: false
        default: minor
        type: choice
        options: [minor, patch, major]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      !startsWith(github.event.workflow_run.head_commit.message || '', 'chore(release)') &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Verify source commit passed CI
        id: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SOURCE_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          HEAD_MSG="$(git log -1 --pretty=%s)"
          if echo "$HEAD_MSG" | grep -q '^chore(release):'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "HEAD already is a release commit ($HEAD_MSG) — skipping."
            exit 0
          fi

          # Ensure SOURCE_SHA actually passed CI before cutting a release
          CONCLUSION="$(gh run list --commit "$SOURCE_SHA" --workflow CI --json conclusion -q '.[0].conclusion' 2>/dev/null || echo '')"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          fi
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::Commit $SOURCE_SHA has not passed CI (conclusion='$CONCLUSION'). Refusing to release."
            exit 1
          fi

          # Ensure HEAD matches SOURCE_SHA (or only chore(release) commits sit between them)
          if [ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]; then
            NON_REL="$(git log --format=%s "${SOURCE_SHA}..HEAD" | grep -vc '^chore(release):' || true)"
            if [ "$NON_REL" != "0" ]; then
              echo "::warning::Newer unverified commits landed on main after $SOURCE_SHA; skipping release for stale run."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Compute next version
        if: steps.src.outputs.skip != 'true'
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUMP="${{ inputs.bump }}"
          else
            BUMP="minor"
          fi
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

          CURRENT="$(tr -d ' \r\n' < VERSION)"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          LATEST="$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1 || true)"
          if [ -z "$LATEST" ]; then
            NEXT="$CURRENT"
          else
            BASE="${LATEST#v}"
            MAJOR="$(echo "$BASE" | cut -d. -f1)"
            MINOR="$(echo "$BASE" | cut -d. -f2)"
            PATCH="$(echo "$BASE" | cut -d. -f3)"
            case "$BUMP" in
              major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR+1)); PATCH=0 ;;
              patch) PATCH=$((PATCH+1)) ;;
            esac
            NEXT="$MAJOR.$MINOR.$PATCH"
          fi
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Bump: $BUMP, current VERSION: $CURRENT, latest tag: ${LATEST:-none}, next: $NEXT"

          if git rev-parse "v$NEXT" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v$NEXT already exists — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit VERSION, tag release commit, and create GitHub Release
        if: steps.src.outputs.skip != 'true' && steps.ver.outputs.exists == 'false'
        id: rel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NEXT="${{ steps.ver.outputs.next }}"
          SOURCE_SHA="${{ steps.src.outputs.source_sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "$(tr -d ' \r\n' < VERSION)" != "$NEXT" ]; then
            printf '%s\n' "$NEXT" > VERSION
            git add VERSION
            git commit -m "chore(release): v$NEXT [skip ci]"
          fi

          RELEASE_SHA="$(git rev-parse HEAD)"
          RELEASE_SHORT="$(echo "$RELEASE_SHA" | cut -c1-7)"
          git tag -a "v$NEXT" -m "Release v$NEXT" "$RELEASE_SHA"
          git push origin HEAD:main "refs/tags/v$NEXT"
          gh release create "v$NEXT" --title "v$NEXT" --target "$RELEASE_SHA" --generate-notes

          {
            echo "RELEASE_SHA=$RELEASE_SHA"
            echo "RELEASE_SHORT=$RELEASE_SHORT"
            echo "SOURCE_CI_SHA=$SOURCE_SHA"
            echo "VERSION=$NEXT"
            echo "TAG=v$NEXT"
          } > release-meta.env

      - name: Record existing release metadata (when tag already existed)
        if: steps.src.outputs.skip != 'true' && steps.ver.outputs.exists == 'true'
        run: |
          set -euo pipefail
          NEXT="${{ steps.ver.outputs.next }}"
          RELEASE_SHA="$(git rev-parse HEAD)"
          RELEASE_SHORT="$(echo "$RELEASE_SHA" | cut -c1-7)"
          {
            echo "RELEASE_SHA=$RELEASE_SHA"
            echo "RELEASE_SHORT=$RELEASE_SHORT"
            echo "SOURCE_CI_SHA=${{ steps.src.outputs.source_sha }}"
            echo "VERSION=$(tr -d ' \r\n' < VERSION)"
            echo "TAG=v$(tr -d ' \r\n' < VERSION)"
          } > release-meta.env

      - name: Upload release metadata artifact
        if: steps.src.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-meta
          path: release-meta.env
          retention-days: 7
          if-no-files-found: error
