# ============================================================================
# LMS Platform — GitHub Actions CI (Lint, Test, Build)
# ============================================================================

name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
  # Every PR, including stacked PRs whose base is another feature branch.
  pull_request:

jobs:
  lint:
    name: Lint (Backend & Frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Lint backend with ruff
        run: ruff check .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Lint frontend with oxlint
        run: npm --prefix frontend run lint

      # UI logic tests use Node's built-in runner on .ts files (type stripping needs Node >= 22.18).
      - name: Set up Node.js for UI tests
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Frontend UI logic tests
        run: npm --prefix frontend test

  test:
    name: Test (Pytest & Django)
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements/*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: Type check with mypy
        run: |
          mypy apps/ --ignore-missing-imports || true

      - name: Collect static files
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: test-secret-key
        run: |
          python manage.py collectstatic --noinput

      - name: Run tests (canonical test suite)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          SECRET_KEY: test-secret-key
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_TASK_ALWAYS_EAGER: "True"
        run: |
          python manage.py check
          python manage.py test tests --verbosity=2

      - name: Coverage check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          SECRET_KEY: test-secret-key
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_TASK_ALWAYS_EAGER: "True"
        run: |
          pytest tests --cov=apps --cov-report=term --cov-report=xml --cov-fail-under=50 -q

  test-postgres:
    # CI's main test job runs on SQLite: config/settings/development.py hard-codes
    # SQLite, so DATABASE_URL is ignored there. This job selects PostgreSQL
    # explicitly (config.settings.postgres_test) so row locks, outer-join locking
    # and other PostgreSQL-only behaviour are exercised. The test runner creates
    # and drops its own test_lms_pg_ci database; nothing else is touched.
    name: Test (PostgreSQL)
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lms_pg_ci
          POSTGRES_USER: lms_pg_user
          POSTGRES_PASSWORD: lms_pg_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lms_pg_user -d lms_pg_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: Run tests on PostgreSQL
        env:
          DJANGO_SETTINGS_MODULE: config.settings.postgres_test
          SECRET_KEY: test-secret-key
          POSTGRES_TEST_ENABLE: "1"
          POSTGRES_TEST_NAME: lms_pg_ci
          POSTGRES_TEST_USER: lms_pg_user
          POSTGRES_TEST_PASSWORD: lms_pg_password
          POSTGRES_TEST_HOST: localhost
          POSTGRES_TEST_PORT: "5432"
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          pytest -q -p no:cacheprovider

  build:
    name: Build (Frontend & Verification)
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build frontend bundle
        run: npm --prefix frontend run build

  browser:
    name: Browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regression-results
          path: frontend/test-results/
          retention-days: 7
